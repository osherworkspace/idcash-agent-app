name: ID-CASH Agent Flutter CI
on:
  pull_request:
  push:
    branches:
      - feature/agent-flutter-onboarding
permissions:
  contents: read
jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate standard Android scaffolding
        run: flutter create . --platforms=android --project-name=idcash_agent_app
      - name: Prepare CI-only placeholder onboarding images
        run: |
          mkdir -p assets/images
          for name in onboarding_agent onboarding_face onboarding_idc app_icon brand_logo; do
            if [ ! -f "assets/images/${name}.png" ]; then
              printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9UeZRRoAAAAASUVORK5CYII=' | base64 -d > "assets/images/${name}.png"
            fi
          done
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
